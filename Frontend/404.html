<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="That EzGrind page could not be found.">
    <title>EzGrind | Page not found</title>

    <link rel="icon" href="assets/logo.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/motion.css">

    <!-- Sets the class every hidden starting state in motion.css hangs
         off. Inline and synchronous so it lands before first paint, and
         absent if scripting is off - in which case nothing is ever
         hidden and the page renders as ordinary content. -->
    <script>document.documentElement.classList.add("js-enabled");</script>
</head>
<body>

    <header id="siteHeader" class="nav"></header>

    <main class="page shell-centered">
        <div class="card error-page">
            <p class="error-page__code" aria-hidden="true">404</p>
            <h1 class="page-header__title">We couldn't find that page</h1>
            <p class="text-muted">
                The link may be out of date, or the address may have a typo in it.
                Nothing you have logged is affected.
            </p>
            <div class="cluster error-page__actions">
                <a class="btn btn--primary" href="index.html">
                    <span>Back to dashboard</span>
                </a>
                <a class="btn btn--secondary" href="log-workout.html">
                    <span>Log a workout</span>
                </a>
            </div>
        </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/components/shell.js"></script>

</body>
</html>
